name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, build, and verify plugin
        run: ./gradlew test :dbml-intellij-plugin:testPackagedPlugin :dbml-intellij-plugin:verifyPlugin --stacktrace

      - name: Test live preview relationship anchors
        run: node dbml-intellij-plugin/src/test/js/preview-routing.test.cjs

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: dbml-diagram-plugin
          path: dbml-intellij-plugin/build/distributions/*.zip
          if-no-files-found: error
