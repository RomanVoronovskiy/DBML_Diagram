name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build plugin
        run: ./gradlew test buildPlugin --stacktrace

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: dbml-diagram-plugin
          path: dbml-intellij-plugin/build/distributions/*.zip
          if-no-files-found: error
