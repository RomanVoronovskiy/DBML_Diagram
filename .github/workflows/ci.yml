name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: dbml_test
          POSTGRES_USER: dbml_test
          POSTGRES_PASSWORD: local_schema_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbml_test -d dbml_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DBML_PG_TEST_URL: jdbc:postgresql://127.0.0.1:5432/dbml_test
      DBML_PG_TEST_USER: dbml_test
      DBML_PG_TEST_PASSWORD: local_schema_test_only

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install pinned SQL-to-DBML test converter
        run: |
          npm install --prefix "$RUNNER_TEMP/dbml-cli" --ignore-scripts --no-audit --no-fund @dbml/cli@10.2.0
          echo "DBML_SQL_IMPORT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "DBML_SQL_IMPORT_ENTRY=$RUNNER_TEMP/dbml-cli/node_modules/@dbml/cli/bin/sql2dbml.js" >> "$GITHUB_ENV"

      - name: Test, build, and verify plugin
        run: ./gradlew test :dbml-intellij-plugin:testPackagedPlugin :dbml-intellij-plugin:verifyPlugin --stacktrace

      - name: Test live preview relationship anchors
        run: node dbml-intellij-plugin/src/test/js/preview-routing.test.cjs

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: dbml-diagram-plugin
          path: dbml-intellij-plugin/build/distributions/*.zip
          if-no-files-found: error
