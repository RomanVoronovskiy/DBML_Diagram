version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      batik:
        patterns:
          - "org.apache.xmlgraphics:*"
      build-toolchain:
        patterns:
          - "jvm"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.intellij.platform"
          - "gradle-wrapper"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
